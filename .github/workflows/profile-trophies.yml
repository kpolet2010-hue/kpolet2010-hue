name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          version: v1.1.1
          options: 'username=kpolet2010-hue&theme=darkhub&column=6&no-frame=true&no-bg=true'
          path: profile/trophy.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit trophy card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/trophy.svg
          if git diff --cached --quiet; then
            echo "Trophy card has not changed."
            exit 0
          fi
          git commit -m "chore: update GitHub trophy card"
          git push
